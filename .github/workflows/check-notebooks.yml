name: Check notebooks

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "requirements.txt"
      - ".claude/skills/new-tutorial/scripts/check_notebook.py"
      - ".github/workflows/check-notebooks.yml"
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "requirements.txt"
      - ".claude/skills/new-tutorial/scripts/check_notebook.py"
      - ".github/workflows/check-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check and execute every notebook
        run: |
          shopt -s globstar nullglob
          notebooks=(notebooks/**/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks found."
            exit 0
          fi
          python .claude/skills/new-tutorial/scripts/check_notebook.py --execute "${notebooks[@]}"
